# SPA + proxy mismo origen. /api → service 'api' del compose (red Docker).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API: pasa la URI completa (/api/finance/...) al backend, prefijo intacto.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: cualquier ruta no-fichero cae en index.html (routing en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
