name: ci

# Gate de calidad: corre en runners de GitHub (no en el server homelab).
# Branch protection exige que 'test' y 'frontend' pasen antes de mergear a main.
# Con auto-merge activado, el PR se mergea solo al ponerse en verde → deploy.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # baseline en main, para que el required check exista

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
